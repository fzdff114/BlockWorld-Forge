name: Publish BlockWorld-Forge 0.6.0

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/RELEASE_NOTES_0.6.0.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run JVM tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK and calculate SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BlockWorld-Forge-0.6.0.apk
          sha256sum BlockWorld-Forge-0.6.0.apk > BlockWorld-Forge-0.6.0-SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          target_commitish: main
          name: BlockWorld-Forge 0.6.0
          body_path: docs/RELEASE_NOTES_0.6.0.md
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            BlockWorld-Forge-0.6.0.apk
            BlockWorld-Forge-0.6.0-SHA256SUMS.txt
