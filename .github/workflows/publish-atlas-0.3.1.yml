name: Publish Atlas 0.3.1

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/RELEASE_NOTES_0.3.1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run JVM format tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          target_commitish: main
          name: Atlas 0.3.1
          body_path: docs/RELEASE_NOTES_0.3.1.md
          draft: false
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
