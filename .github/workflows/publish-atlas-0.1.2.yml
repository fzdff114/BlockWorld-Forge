name: Publish Atlas 0.1.2

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/RELEASE_NOTES_0.1.2.md'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 Atlas APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          target_commitish: main
          name: Atlas 0.1.2
          body_path: docs/RELEASE_NOTES_0.1.2.md
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
